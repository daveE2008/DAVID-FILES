
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamPort - CBT Portal</title>

    <style>
        body {
            background-color: #ddffdd;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: blue;
            background-color: rgb(235, 6, 6);
            padding: 10px;
        }

        input {
            padding: 8px;
            margin-top: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>EXAMPORT</h1>
    <p>Computer-Based Testing Portal</p>
    <hr>

    <h2>Welcome, Candidate!</h2>

    <p>
        Your journey to success starts here.
        Enter your details to access your examination.
    </p>

    <form id="candidateForm">
        <label for="name">Student Name:</label><br>
        <input type="text" id="name"
               placeholder="Enter your full name" required>
        <br><br>

        <label for="examno">Examination Number:</label><br>
        <input type="text" id="examno"
               placeholder="Enter examination number" required>
        <br><br>

        <button type="submit">Proceed to Examination</button>
    </form>

    <p>Please ensure your details are correct before proceeding.</p>

    <script>
        // Collect the candidate's details when the form is submitted, save
        // them for the examination page, clear any stale result, and continue.
        document.getElementById("candidateForm")
            .addEventListener("submit", function(event) {

                // Keep the browser on this page while the form data is handled
                // by this script instead of performing a normal form request.
                event.preventDefault();

                // Read both input fields and trim surrounding whitespace so
                // accidental spaces are not stored as part of the details.
                const name =
                    document.getElementById("name").value.trim();

                const examno =
                    document.getElementById("examno").value.trim();

                // localStorage makes the candidate details available to the
                // examination and results pages after navigation.
                localStorage.setItem("studentName", name);
                localStorage.setItem("examNumber", examno);

                // Remove the previous attempt's result so it cannot be
                // mistaken for the result of the new examination.
               // localStorage.removeItem("examResult");

                // Move the candidate to the page where the questions are shown.
                window.location.href = "examination.html";
            });
    </script>

</body>
</html>
